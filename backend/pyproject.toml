[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "howlens-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.0", "starlette==1.7.0", "pydantic==2.14.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pillow==12.3.0", "httpx==0.28.1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["howlens*"]

[tool.setuptools.package-data]
howlens = ["manual_sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
